<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeafletJS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 900px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inisialisasi peta
        var map = L.map('map').setView([-6.175, 106.827], 11);

        // Basemap
        var Esri_WorldImagery = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri'
        });

        var OpenTopoMap = L.tileLayer(
            'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data &copy; OpenStreetMap contributors'
        });

        var OSM = L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map); // default aktif

        // Circle
        var circle = L.circle([-6.33, 106.69], {
            color: "green", // warna garis
            opacity: 0.7, // opacity garis
            fillColor: "green", // warna fill
            fillOpacity: 0.2, // opacity fill
            radius: 12000, // radius dalam meter
        }).bindPopup("<b>Tangerang</b>");

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Polyline
        var vertexPolyline = [
            [-6.29, 106.89],
            [-6.1753924, 106.8271528],
            [-6.33, 106.69],

        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "Yellow", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
        })

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        // Polygon
        var vertexPolygon = [
            [-6.1658431, 106.8107076],
            [-6.1880214, 106.8150856],
            [-6.2039522, 106.8273613],
            [-6.2087288, 106.8477058],
            [-6.1560987, 106.8510536],
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "red", // warna garis
            weight: 3, // ketebalan garis
            opacity: 0.7, // opacity garis
            fillColor: "red", // warna fill
            fillOpacity: 0.4, // opacity fill
        }).bindPopup("Area Jakarta Pusat");

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);


        // Marker
        var marker = L.marker([-6.1753924, 106.8271528]).bindPopup("<b>Jakarta</b><br>tempat lahir gweh");
        var marker2 = L.marker([-6.29, 106.89]).bindPopup("<b>Jaktim</b><br>Nah ini nih");
        // Tambahkan marker default ke peta
        marker.addTo(map);
        marker2.addTo(map);

        // Tooltip
        marker.bindTooltip("<b>Lah inimah Jakarta</b>");
        marker2.bindTooltip("<b>Lah inimah Jaktim</b>");
        circle.bindTooltip("Tangerang", { sticky: true });
        polyline.bindTooltip("Garis Inimah", { sticky: true });
        polygon.bindTooltip("Poligon Inimah", { sticky: true });

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": OSM,
            "OpenTopoMap": OpenTopoMap,
            "Esri World Imagery": Esri_WorldImagery
        };

        var overlayMaps = {
            "Jakarta": marker,
            "Jaktim": marker2,
            "Circle": circle,
            "Garis": polyline,
            "Area": polygon,
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);
        // Scale
        var scale = L.control.scale({ imperial: false, position: "bottomright", });
        scale.addTo(map);


        
    </script>
</body>

</html>
